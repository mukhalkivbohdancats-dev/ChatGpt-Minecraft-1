name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: blockworld-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build BlockWorld Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and package debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename and verify APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BlockWorld-Android.apk
          test -s dist/BlockWorld-Android.apk
          ls -lh dist/BlockWorld-Android.apk
          sha256sum dist/BlockWorld-Android.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-Android-v0.5.0
          path: dist/BlockWorld-Android.apk
          if-no-files-found: error
          retention-days: 14
